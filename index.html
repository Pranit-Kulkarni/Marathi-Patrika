<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pranit & Mrudula</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- OPENING IMAGE PAGE -->
  <section id="landing" class="image-page opening-page">
    <img src="assets/background.jpg" class="page-image" alt="Opening invitation">

    <button class="seal-button" onclick="openInvite()">
      ✿
    </button>
  </section>

  <!-- INSIDE IMAGE PAGE -->
  <main id="content">
    <section class="image-page inside-page">
      <img src="assets/inside_image.jpg" class="page-image" alt="Wedding invitation">

      <div class="matter">
        <h1>Pranit & Mrudula</h1>

        <p>Saturday, 4th July 2026</p>
        <p>Muhurat · 12:39 PM</p>

        <div id="countdown">
          <div><span id="days">0</span><small>DAYS</small></div>
          <div><span id="hours">0</span><small>HOURS</small></div>
          <div><span id="minutes">0</span><small>MINUTES</small></div>
          <div><span id="seconds">0</span><small>SECONDS</small></div>
        </div>

        <a href="https://share.google/a6bNXOxOQigWAY6E9" target="_blank">
          View Location 📍
        </a>
      </div>
    </section>
  </main>

  <audio id="bgMusic" loop>
    <source src="assets/music.mp3" type="audio/mp3">
  </audio>

  <script src="script.js"></script>
</body>
</html>
