<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <title>
    Pranit & Mrudula
  </title>

  <!-- Fonts -->

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap"
    rel="stylesheet">

  <!-- CSS -->

  <link rel="stylesheet"
    href="style.css">

</head>

<body>

  <!-- OPENING SCREEN -->

  <section
    class="opening"
    id="opening">

    <div class="seal-container">

      <div
        class="seal"
        onclick="openInvite()">

        ✿

      </div>

      <p class="tap-text">
        TAP TO OPEN
      </p>

    </div>

  </section>

  <!-- MAIN CONTENT -->

  <main id="content">

    <!-- HERO PAGE -->

    <section class="hero">

      <img
        src="assets/couple.jpg"
        class="hero-image">

      <div class="hero-overlay"></div>

      <div class="hero-content">

        <p class="top-line">
          A NEW CHAPTER BEGINS
        </p>

        <p class="save-date">
          SAVE THE DATE:
          JULY 4, 2026
        </p>

        <h1>
          Pranit & Mrudula
        </h1>

        <div class="divider"></div>

        <p class="quote">
          “Sabne Poocha ‘Kab?’<br>
          Humne Bola ‘Ab!’”
        </p>

        <p class="countdown-title">
          Counting down to our big day
        </p>

        <div id="countdown">

          <div class="time-box">
            <span id="days">0</span>
            <small>DAYS</small>
          </div>

          <div class="time-box">
            <span id="hours">0</span>
            <small>HOURS</small>
          </div>

          <div class="time-box">
            <span id="minutes">0</span>
            <small>MINUTES</small>
          </div>

          <div class="time-box">
            <span id="seconds">0</span>
            <small>SECONDS</small>
          </div>

        </div>

        <p class="side-question">
          Tum Kis Side Ho?
        </p>

        <div class="teams">

          <button>
            Team Groom
          </button>

          <button>
            Team Bride
          </button>

        </div>

        <p class="bottom-line">
          Think Fast...
          Baraat Won’t Wait
        </p>

      </div>

    </section>

  </main>

  <!-- AUDIO -->

  <audio
    id="bgMusic"
    loop>

    <source
      src="assets/music.mp3"
      type="audio/mp3">

  </audio>

  <!-- JS -->

  <script src="script.js"></script>

</body>

</html>
